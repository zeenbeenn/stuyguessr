<!DOCTYPE html>
<html>
<body>
  <h1>StuyGuessr</h1>
    <form method="POST" action="/">
        {% if result is defined %}
            <h2>{{ "Correct!" if result else "Incorrect!" }}</h2>
            <button type="submit">Next</button>

        {% elif locations is defined %}
            <img src="{{ url_for('static', filename=img) }}" style="width: 400px; height: auto; object-fit: contain;">
            <br>
            <h3>Where is this closest to?</h3>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 800px; margin-bottom: 15px;">
                {% for location in locations %}
                    <label style="cursor: pointer;">
                        <input type="radio" name="location" value="{{ location }}"> 
                        {{ location }}
                    </label>
                {% endfor %}
            </div>
            <input type="hidden" name="floor" value="{{ floor }}">
            <input type="hidden" name="img" value="{{ img }}">
            <button type="submit">Submit</button>

        {% else %}
            <img src="{{ url_for('static', filename=img) }}" style="width: 400px; height: auto; object-fit: contain;">
            <br>
            <input type="hidden" name="img" value="{{ img }}">
            Floor: <input type="text" name="floor">
            <button type="submit">Submit</button>

        {% endif %}

    </form>
</body>
</html>
